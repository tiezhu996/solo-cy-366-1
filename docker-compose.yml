name: esportsbar

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-esportsbar}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-esportsbar_pwd}
      MYSQL_DATABASE: ${DB_NAME:-esportsbar_db}
      MYSQL_USER: ${DB_USER:-esportsbar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-esportsbar_pwd}
    ports:
      - "${DB_PORT:-44005}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-esportsbar_pwd}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-esportsbar}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-46305}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-esportsbar}-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-esportsbar_db}
      DB_USER: ${DB_USER:-esportsbar_user}
      DB_PASSWORD: ${DB_PASSWORD:-esportsbar_pwd}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRE_SEC: "86400"
      LOG_LEVEL: info
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
    ports:
      - "${BACKEND_PORT:-29506}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-esportsbar}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-28506}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
